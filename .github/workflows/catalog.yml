name: Model catalog
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: catalog-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate catalog and generated files
        env:
          CATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 tools/catalog.py --check --base "$CATALOG_BASE_SHA"
      - name: Validate rejection cases and page limits
        run: python3 -m unittest discover -s tools -p 'test_catalog.py' -v
